.acc{color:#8E8CF7}

.btn.g{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#E8ECF4}

.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:#6B7590;font-weight:550}
.tab.on{color:#8E8CF7}
.tab svg{width:24px;height:24px}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#E8ECF4;opacity:.85}
.ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.row{display:flex;align-items:center;gap:13px}
.pill{font-size:12px;padding:5px 10px;border-radius:20px;background:rgba(142,140,247,.12);color:#8E8CF7;font-weight:600}
